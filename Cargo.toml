[package]
name = "runlet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Secure ephemeral GitHub Actions runner orchestrator for NixOS and rootless Podman"
readme = "README.md"
documentation = "https://docs.rs/runlet"
homepage = "https://github.com/davidvornholt/runlet"
repository = "https://github.com/davidvornholt/runlet"
keywords = ["github-actions", "runner", "nixos", "podman"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = "11.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
