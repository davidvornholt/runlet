[package]
name = "runlet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Secure ephemeral GitHub Actions runner orchestrator for NixOS and rootless Podman"
readme = "README.md"
documentation = "https://docs.rs/runlet"
homepage = "https://github.com/davidvornholt/runlet"
repository = "https://github.com/davidvornholt/runlet"
keywords = ["github-actions", "runner", "nixos", "podman"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.86"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.16", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.12.1"
jsonwebtoken = "9.3.0"
reqwest = { version = "0.12.7", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
sha2 = "0.10.8"
thiserror = "1.0.63"
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
uuid = { version = "1.10.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.12.0"
